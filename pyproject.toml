[project]
name = "legged-rl"
version = "0.0.0"
description = ""
authors = [{ name = "Grigorii Sizikov", email = "sizgrisha@gmail.com" }]
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
    "gymnasium[mujoco] (>=1.2.3,<2.0.0)",
    "pybind11-stubgen (>=2.5.5,<3.0.0)",
    "stable-baselines3[extra] (>=2.7.1,<3.0.0)",
    "typer (>=0.24.1,<0.25.0)",
    "setuptools (<70)",
]

[tool.poetry]
packages = [{ include = "legged_rl", from = "src" }]

[[tool.poetry.source]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
priority = "supplemental"

[tool.poetry.group.xpu.dependencies]
torch = { version = "*", source = "pytorch-xpu" }
torchvision = { version = "*", source = "pytorch-xpu" }
intel-cmplr-lib-rt = { version = "*" }
intel-cmplr-lib-ur = { version = "*" }
intel-cmplr-lic-rt = { version = "*" }
intel-sycl-rt = { version = "*" }

[tool.pyright]
extraPaths = ["./typings"]

[tool.poetry.scripts]
lrl = "legged_rl.cli:app"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
